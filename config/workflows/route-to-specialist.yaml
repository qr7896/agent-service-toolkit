# 多 Agent 协同示例：由一个 supervisor 在候选里选一个执行。
# routing_prompt 写清选人规则；解析不出候选就退回第一个，不会凭空造一个 Agent 出来。
key: route-to-specialist
description: 按需求类型在候选 Agent 中挑一个执行。
mode: router
routing_prompt: |
  你是调度员。根据用户需求，在候选 Agent 里选一个最合适的执行：
  - repo-explainer：**只在需求明确指向本仓库的具体代码时**选它
    （例如"这个函数在哪""src/x.py 是怎么实现的""解释一下 X 的实现"）
  - chatbot：其它一切情况——通用知识问答、概念解释、总结、列清单、
    任何与"本仓库某段具体代码"无关的问题，都选它
  判断顺序：先问"用户是否点名了本仓库的具体文件/函数？"否，就一律选 chatbot。
  只回复候选 key，不要解释。
candidates:
  - repo-explainer
  - chatbot
